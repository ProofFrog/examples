schema_version = 2

[[entry]]
transform = "<hop>"
description = "5_8_e hop_1: PRGSecurity(G).Real o R1 ~ INDOT$(P).Real o R2 (deterministic-reorder; couple samples + eliminate calls)."
added = "2026-05-31"
game_before = '''
proc Query() : BitString<lambda + 2 * lambda> = {
  var v : BitString<lambda>;
  v <$ BitString<lambda>;
  var v : BitString<G.lambda + G.stretch>;
  v <@ G.evaluate(v);
  var v : BitString<G.lambda + G.stretch>;
  v <@ G.evaluate(0^lambda);
  return (v BinaryOperators.ADD v);
}
'''
game_after = '''
proc Query() : BitString<lambda + 2 * lambda> = {
  var v : BitString<lambda>;
  v <$ BitString<lambda>;
  var v : BitString<lambda>;
  v = v;
  var v : BitString<G.lambda + G.stretch>;
  v <@ G.evaluate(v);
  var v : BitString<G.lambda + G.stretch>;
  v <@ G.evaluate(0^lambda);
  var v : BitString<lambda + 2 * lambda>;
  v = (v BinaryOperators.ADD v);
  var v : BitString<3 * lambda>;
  v = v;
  return v;
}
'''
tactic = '''
proc. inline *. sp. wp.
swap{2} 3 -2.
seq 1 1 : (s{1} = k0{2}).
+ rnd (fun (x : bs_lambda) => x); skip => />.
seq 0 1 : (s{1} = k0{2} /\ _r0{2} = G_c.ev_evaluate zero_lambda).
+ exists* (glob G){2}; elim* => g2; call{2} (G_evaluate_det g2 zero_lambda); auto.
sp.
exists* (glob G){1}; elim* => g1. exists* (glob G){2}; elim* => g2.
exists* k1{2}; elim* => k1v. call{2} (G_evaluate_det g2 k1v).
call{1} (G_evaluate_det g1 zero_lambda). wp.
exists* s{1}; elim* => sv. call{1} (G_evaluate_det g1 sv).
skip => /#.
'''

[[entry]]
transform = "<hop>"
description = "5_8_e hop_3: INDOT$(P).Random o R2 ~ PRGSecurity(H).Random (dead G.evaluate via INDOT$.Random; peel + couple samples)."
added = "2026-05-31"
game_before = '''
proc Query() : BitString<lambda + 2 * lambda> = {
  var v : BitString<lambda + 2 * lambda>;
  v <$ BitString<lambda + 2 * lambda>;
  var v : BitString<3 * lambda>;
  v = v;
  return v;
}
'''
game_after = '''
proc Query() : BitString<lambda + 2 * lambda> = {
  var v : BitString<lambda + 2 * lambda>;
  v <$ BitString<lambda + 2 * lambda>;
  return v;
}
'''
tactic = '''
proc. inline *. sp. wp.
seq 1 0 : (true).
+ exists* (glob G){1}; elim* => g1; call{1} (G_evaluate_det g1 zero_lambda); auto.
sp.
rnd.
auto.
'''

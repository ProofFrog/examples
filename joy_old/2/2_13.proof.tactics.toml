[[entry]]
transform = "Inline Local Tuple Literal"
description = "2_13 micro_0_left_2: inline the Key tuple (key1,key2) and reduce the projections; deterministic body, closes by auto."
added = "2026-06-14"
game_before = '''
proc CTXT(m : BitString<lambda>) : BitString<lambda> = {
  var __a0__ : BitString<lambda>;
  __a0__ <$ BitString<lambda>;
  var __a1__ : BitString<lambda>;
  __a1__ <$ BitString<lambda>;
  var __a2__ : [BitString<lambda>, BitString<lambda>];
  __a2__ = (__a0__, __a1__);
  return (__a2__[1] BinaryOperators.ADD (__a2__[0] BinaryOperators.ADD m));
}
'''
game_after = '''
proc CTXT(m : BitString<lambda>) : BitString<lambda> = {
  var __a0__ : BitString<lambda>;
  __a0__ <$ BitString<lambda>;
  var __a1__ : BitString<lambda>;
  __a1__ <$ BitString<lambda>;
  return (__a1__ BinaryOperators.ADD (__a0__ BinaryOperators.ADD m));
}
'''
tactic = '''
proc. auto.
'''


schema_version = 2

[[entry]]
transform = "Inline Local Tuple Literal"
description = "2_13 micro_0_left_2: inline the Key tuple (key1,key2) and reduce the projections; deterministic body, closes by auto."
added = "2026-06-14"
game_before = '''
proc CTXT(v : BitString<lambda>) : BitString<lambda> = {
  var v : BitString<lambda>;
  v <$ BitString<lambda>;
  var v : BitString<lambda>;
  v <$ BitString<lambda>;
  var v : [BitString<lambda>, BitString<lambda>];
  v = (v, v);
  return (v[1] BinaryOperators.ADD (v[0] BinaryOperators.ADD v));
}
'''
game_after = '''
proc CTXT(v : BitString<lambda>) : BitString<lambda> = {
  var v : BitString<lambda>;
  v <$ BitString<lambda>;
  var v : BitString<lambda>;
  v <$ BitString<lambda>;
  return (v BinaryOperators.ADD (v BinaryOperators.ADD v));
}
'''
tactic = '''
proc. auto.
'''


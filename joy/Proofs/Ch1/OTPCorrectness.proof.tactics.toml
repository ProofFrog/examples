  return (v BinaryOperators.ADD (v BinaryOperators.ADD v));
}
'''
game_after = '''
proc Test(v : BitString<lambda>, v : BitString<lambda>) : BitString<lambda>? = {
  return v;
}
'''
tactic = '''
proc.
auto => />.
smt(xor_lambda_invol xor_lambda_commut).
